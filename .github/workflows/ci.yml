name: CI

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghost-ses-proxy:ci

      - name: Syntax-check every source file
        run: |
          docker run --rm --entrypoint sh ghost-ses-proxy:ci -c \
            'for f in server.js lib/*.js; do node --check "$f" || exit 1; done'

      - name: Verify runtime dependencies resolve in the image
        run: |
          docker run --rm --entrypoint node ghost-ses-proxy:ci -e "
            require('express');
            require('better-sqlite3');
            require('@aws-sdk/client-ses');
            require('@aws-sdk/client-sqs');
            require('busboy');
            require('uuid');
          "
