name: CI

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:coverage

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghost-ses-proxy:ci

      - name: Syntax-check the built entrypoint
        run: |
          docker run --rm --entrypoint node ghost-ses-proxy:ci --check dist/index.js

      - name: Verify runtime dependencies resolve in the image
        run: |
          docker run --rm --entrypoint node ghost-ses-proxy:ci -e "
            require('express');
            require('better-sqlite3');
            require('@aws-sdk/client-ses');
            require('@aws-sdk/client-sqs');
            require('busboy');
            require('uuid');
            require('pino');
            require('pino-http');
            require('prom-client');
          "
